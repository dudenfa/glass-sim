[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "glass-sim"
version = "0.1.0"
description = "GLASS: a transparent perpetual-futures market simulator for multi-agent reinforcement learning (plus the legacy marl_trading spot-market thesis code)"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Proprietary"}
authors = [{name = "dudenfa"}]
dependencies = [
    "numpy>=1.26",
    "Pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
analysis = ["pandas>=2.0"]
rl = [
    "gymnasium>=0.29,<1.0",
    "stable-baselines3>=2.3,<3.0",
    "sb3-contrib>=2.3,<3.0",
]

[project.scripts]
glass = "glass_sim.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
"glass_sim.live" = ["static/*"]
"marl_trading.live" = ["static/*"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
